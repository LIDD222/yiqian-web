<script>window.YIQIAN_ART_VER = "2506565824_9528904";</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4151824,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
(function () {
	const boot = document.getElementById('boot');
	const fill = document.getElementById('fill');
	const meta = document.getElementById('meta');
	const tip = document.getElementById('tip');
	const err = document.getElementById('err');
	const tips = ['雙指捏合縮放地圖，雙指旋轉視角。', '點地點膠囊牌，再按「帶我去」。', '符剋鬼、程式剋機、香火剋魂。', '切換「以前／現在／未來」看同一座城的三種樣子。'];
	let ti = 0; const tipTimer = setInterval(() => { tip.textContent = tips[ti++ % tips.length]; }, 3200);
	function fail(e) {
		console.error(e);
		clearInterval(tipTimer);
		document.getElementById('errmsg').textContent = '載入失敗：' + (e && e.message ? e.message : String(e)) + '。請確認網路後重試；若持續失敗，請改用最新版 Chrome / Safari。';
		err.style.display = 'block';
		meta.textContent = '';
	}
	document.getElementById('retry').onclick = () => location.reload();
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length) { fail(new Error('瀏覽器缺少功能：' + missing.join('、'))); return; }
	window.yiqianLoadStart = performance.now();
	const engine = new Engine(GODOT_CONFIG);
	function flushSave() { if (window.__yiqianSave) window.__yiqianSave(); }
	document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
	window.addEventListener('pagehide', flushSave);
	engine.startGame({
		onProgress: function (cur, total) {
			if (total > 0) {
				const pct = Math.min(100, Math.floor(cur / total * 100));
				fill.style.width = pct + '%';
				meta.textContent = (cur / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB・' + pct + '%';
			} else if (cur > 0) {
				meta.textContent = (cur / 1048576).toFixed(1) + ' MB';
			}
		},
	}).then(() => {
		window.yiqianEngineStarted = performance.now();
		meta.textContent = '啟動中…';
		fill.style.width = '100%';
		clearInterval(tipTimer);
		setTimeout(() => { boot.classList.add('hide'); setTimeout(() => boot.remove(), 600); }, 250);
	}, fail);
	const ua = navigator.userAgent || '';
	if (/iPhone|iPad|Android/i.test(ua) && screen.orientation && screen.orientation.lock) { screen.orientation.lock('portrait').catch(() => {}); }
}());
</script>
